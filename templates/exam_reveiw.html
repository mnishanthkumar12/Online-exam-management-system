<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Exam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>
    <div class="container">
        <h1>Review Your Exam</h1>
        <form method="post" action="{{ url_for('submit_review') }}">
            {% for question in skipped_questions %}
                <div class="question">
                    <p>{{ question.text }}</p>
                    <!-- Provide answer options here -->
                    <input type="radio" name="question_{{ question.id }}" value="option1"> Option 1
                    <input type="radio" name="question_{{ question.id }}" value="option2"> Option 2
                </div>
            {% endfor %}
            <input type="submit" value="Submit Review">
        </form>
    </div>
</body>
</html>
